name: Java CI/CD with Docker

on:
  push:
    branches:
      - main  # Trigger när kod pushas till main-branchen

jobs:
  build:
    runs-on: ubuntu-latest  # Använd Ubuntu för att köra bygg- och testjobben
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2  # Hämtar koden från repository

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'  # Sätt rätt Java-version för byggandet

      - name: Build with Maven
        run: mvn clean install  # Bygg projektet med Maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1  # Sätt upp Docker Buildx

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Lägg till Docker Hub användarnamn som secrets
          password: ${{ secrets.DOCKER_PASSWORD }}  # Lägg till Docker Hub lösenord som secrets

      - name: Build and push Docker image
        run: |
          docker build -t your-dockerhub-username/your-repo-name .  # Bygg Docker-bilden
          docker push your-dockerhub-username/your-repo-name  # Publicera Docker-bilden till Docker Hub
          
  test:
    runs-on: ubuntu-latest  # Kör på Ubuntu
    needs: build  # Kör efter build-jobbet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      - name: Run tests
        run: mvn test  # Kör tester med Maven
